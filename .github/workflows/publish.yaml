name: Publish to PyPI

# Runs on a version tag (v1.2.3), which the release workflow of marktmentor-sdk
# pushes. PyPI trusts this workflow (trusted publishing): no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version matches the tag
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only v* tags may use this environment. After the repository is public, add
    # yourself as required reviewer in Settings → Environments → pypi.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
