[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marktmentor"
version = "0.1.0"
description = "Official SDK for the MarktMentor Public API: bol product research and your own store data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typing_extensions>=4.7",
]

[project.urls]
Documentation = "https://api.marktmentor.nl"

[tool.hatch.build.targets.wheel]
packages = ["src/marktmentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
